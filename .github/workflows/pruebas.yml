name: Pruebas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:hu
      - run: npm run build

  docker:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: pruebas_ci_temporales
      DATABASE_URL: postgresql://roomie:pruebas_ci_temporales@127.0.0.1:5432/roomie
      APP_URL: http://localhost:3000
      PLAYWRIGHT_CHANNEL: chromium
      E2E_EXTERNAL_SERVER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - name: Iniciar la aplicación con Docker
        run: docker compose -f compose.yaml -f .github/compose.pruebas.yaml up -d --build --wait
      - run: npm run test:integration
      - run: npm run test:e2e
      - name: Guardar los registros de Docker
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.pruebas.yaml logs --no-color > docker-pruebas.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: |
            playwright-report/
            test-results/
            docker-pruebas.log
          retention-days: 7
      - name: Detener el entorno de pruebas
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.pruebas.yaml down -v
