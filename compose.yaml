services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: roomie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: roomie
    volumes:
      - roomie_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomie"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
      LOCAL_DATABASE: "false"
    ports: ["3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
    command: ["npx", "tsx", "scripts/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  roomie_db:
