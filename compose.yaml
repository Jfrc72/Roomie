# Instrucciones en el README ("Usar con Docker"). Requiere POSTGRES_PASSWORD en .env.
# DATABASE_URL y LOCAL_DATABASE del .env son de npm run dev: aquí se reemplazan para
# que todos los servicios usen la base del contenedor db.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: roomie
    volumes:
      - roomie_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomie"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Aplica las migraciones pendientes y termina; web y worker esperan a que acabe bien.
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
      LOCAL_DATABASE: "false"
    ports: ["3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Recordatorios, envíos y cierre automático de votaciones.
  worker:
    build:
      context: .
      target: build
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roomie:${POSTGRES_PASSWORD}@db:5432/roomie
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  roomie_db:
